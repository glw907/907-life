# 907.life Hugo Configuration

baseURL = "https://907.life/"
languageCode = "en-us"
title = "907.life"

# Author
[params]
  author = "Geoffrey L. Wright"
  description = "Alaska adventures, philosophical musings, technology, books, music, photography, and whatever else comes to mind."
  email = "geoff@907.life"

# Pagination
[pagination]
  pagerSize = 20
  path = "page"

# Permalinks
[permalinks]
  posts = "/:year/:month/:day/:slug/"

# Taxonomies - tags only, no categories
[taxonomies]
  tag = "tags"

# Menu configuration
[menu]
  [[menu.main]]
    name = "Home"
    url = "/"
    weight = 1

  [[menu.main]]
    name = "Photos"
    url = "https://photos.907.life"
    weight = 2
    [menu.main.params]
      external = true

  [[menu.main]]
    name = "Archives"
    url = "/archives/"
    weight = 3

  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 4

# Markup configuration
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

  [markup.highlight]
    codeFences = true
    guessSyntax = false
    lineNos = false
    style = "monokai"

# Output formats
[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]

# RSS configuration
[outputFormats.RSS]
  mediaType = "application/rss+xml"
  baseName = "feed"

# JSON feed configuration
[outputFormats.JSON]
  mediaType = "application/json"
  baseName = "feed"
  isPlainText = true

# Privacy - disable third-party tracking
[privacy]
  [privacy.disqus]
    disable = true
  [privacy.googleAnalytics]
    disable = true
  [privacy.instagram]
    disable = true
  [privacy.twitter]
    disable = true
  [privacy.vimeo]
    disable = true
  [privacy.youtube]
    disable = true
