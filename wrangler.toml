# 907.life — Cloudflare Workers (SvelteKit adapter-cloudflare)
name = "907-life"
# Lets cairn-doctor derive the account for its D1 auth-store check.
account_id = "120c269ad6d3dfbe6d63a0bb53758ca0"
compatibility_date = "2025-05-05"
compatibility_flags = ["nodejs_compat"]

main = ".svelte-kit/cloudflare/_worker.js"

# Workers Logs ingests and indexes every console record, including cairn-cms's structured
# diagnostic events (auth, commit, guard) from 0.36.0. Query them by `event` or `editor` in the
# dashboard Logs tab. See ../cairn-cms/docs/guides/read-cairn-logs.md.
[observability]
enabled = true

# not_found_handling = "none" (the schema's own default, set here explicitly) passes an unmatched
# request through to the Worker instead of serving a static 404 straight from the edge, so
# SvelteKit's built-in default-404 handling renders the themed root src/routes/+error.svelte
# through a real SSR response. See ../cairn-cms/examples/showcase/src/chassis/README.md's "The
# themed-404 pattern".
[assets]
directory = ".svelte-kit/cloudflare"
binding = "ASSETS"
not_found_handling = "none"

[[send_email]]
name = "SEND_EMAIL"
destination_address = "geoff@907.life"

# cairn-cms: unrestricted Email Sending binding for magic links (arbitrary recipients).
# remote = true so `wrangler dev` sends real mail.
[[send_email]]
name = "EMAIL"
remote = true

# cairn-cms: self-owned magic-link auth store — editor allowlist, sessions, magic tokens.
[[d1_databases]]
binding = "AUTH_DB"
database_name = "cairn-907-auth"
database_id = "93aa929d-0228-4f8b-8d1e-5e7e0d755617"

# cairn-cms 0.57+: R2 bucket backing the media library. The /media delivery route streams
# content-addressed image bytes from here; the adapter's assets block names this binding.
[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "907-life-media"

# The about page's contact form (Turnstile spam check + the SEND_EMAIL destination). The secret
# check and the destination address are Worker secrets, never committed here:
# `npx wrangler secret put TURNSTILE_SECRET_KEY` and `npx wrangler secret put CONTACT_EMAIL`.

[vars]
# Canonical origin for magic-link confirmation links, never read from a request header.
# Dev overrides via PUBLIC_ORIGIN in .dev.vars.
PUBLIC_ORIGIN = "https://907.life"
# The contact form's Turnstile site key: public by design (it ships in the served HTML), so it is
# a plain var, not a secret. Cloudflare's published always-passes test key until Geoff swaps in
# the real 907.life site key.
PUBLIC_TURNSTILE_SITE_KEY = "1x00000000000000000000AA"

[[routes]]
pattern = "907.life"
custom_domain = true
